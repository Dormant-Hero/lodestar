[package]
name = "lodestar"
version = "0.17.0"
edition = "2024"
description = "Fast game library and controller-mode frontend for Linux"
license = "MIT"

[dependencies]
anyhow = "1"
# Emulation: ROM CRCs, BIOS MD5s, the compressed ROM hash database (pure Rust).
crc32fast = "1"
crossbeam-channel = "0.5"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
egui = "0.37"
env_logger = "0.11"
gilrs = "0.11"
ksni = { version = "0.3.7", default-features = false, features = ["tokio", "blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "qoi", "gif", "bmp", "ico"] }
libc = "0.2"
log = "0.4"
md-5 = "0.10"
miniz_oxide = "0.8"
parking_lot = "0.13"
resvg = { version = "0.50", default-features = false, features = ["raster-images"] }
rfd = "0.18"
roxmltree = "0.21"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Theme sounds and background music: decoding wav / ogg / mp3 / flac (pure Rust; output goes to
# the desktop's own pw-cat / pacat / aplay, no audio library is linked).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "adpcm"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
x11rb = { version = "0.13", features = ["randr"] }

[dev-dependencies]
tempfile = "3.27.0"
# The tray's D-Bus check (tray_tests.rs): a fake StatusNotifierWatcher on a private bus.
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
