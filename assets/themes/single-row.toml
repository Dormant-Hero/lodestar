z = 1
size = [1.0, 1.0]
gradient = ["#0c0f14a0", "#0c0f14f0"]

[[collections.elements]]
type = "rail"
name = "rail"
z = 6
compact = true
pos = [0.008, 0.2]
size = [0.15, 0.6]
style = { font = "medium", font_size = 0.022, color = "#f2f4f8" }
current_color = "#ffffff"
selector_color = "#4c8dff"
background = "#0c0f14e6"

[[collections.elements]]
type = "datetime"
name = "pn_clock"
z = 6
clock = true
format = "%H:%M"
pos = [0.955, 0.051]
