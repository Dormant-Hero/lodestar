# The selected game's achievement count under its name, when the library knows it.
[[games.elements]]
type = "stack"
name = "selected_achievements"
z = 5
visible_if = "{game.achievements}"
direction = "horizontal"
justify = "end"
pos = [0.955, 0.185]
origin = [1.0, 0.5]

[[games.elements.children]]
type = "stack"
name = "selected_achievements_pill"
gap = 0.004
padding = [0.007, 0.0045]
background = "#ffffff14"
corner_radius = 0.004
[[games.elements.children.children]]
type = "text"
text = "{game.achievementslabel}"
style = { font = "medium", font_size = 0.017, color = "#f2f4f8" }
[[games.elements.children.children]]
type = "rect"
size = [0.0, 0.003]
color = "#4c8dff"
track = "#ffffff2e"
fill = "{game.achievementspercent}"
corner_radius = 0.0015

[[games.elements]]
type = "text"
name = "pn_count"
z = 5
text = "{list.countlabel}"
pos = [0.07, 0.185]
origin = [0.0, 0.5]
style = { font = "medium", font_size = 0.023, color = "#a7afbd" }

[[games.elements]]
type = "grid"
name = "pn_list"
z = 4
pos = [0.07, 0.235]
size = [0.895, 0.67]
columns = 7
item_aspect = 1.5
spacing = 0.022
item_image = "{art.cover}"
item_text = "{game.name}"
item_text_style = { font = "medium", font_size = 0.017, color = "#e2e6ee", align = "center" }
show_labels = true
item_fit = "cover"
item_background = "#1f2530"
corner_radius = 0.008
selected_scale = 1.07
selected_border = "#ffffff"
unselected_opacity = 0.85
controller_badge = true
favorite_badge = true

[[games.elements]]
type = "helpbar"
name = "pn_help"
z = 7
pos = [0.955, 0.96]
origin = [1.0, 0.5]
size = [0.8, 0.042]
style = { font = "medium", font_size = 0.02, color = "#c9cfda", align = "right" }
