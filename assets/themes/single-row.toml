style = { font = "medium", font_size = 0.023, color = "#a7afbd" }

[[collections.elements]]
type = "grid"
name = "pn_list"
z = 4
pos = [0.07, 0.24]
size = [0.895, 0.66]
columns = 4
item_aspect = 0.5625
spacing = 0.024
item_image = "{collection.hero}"
item_fallbacks = ["{collection.banner}", "{collection.cover}"]
item_text = "{collection.name}"
item_text_style = { font = "bold", font_size = 0.025, color = "#f2f4f8" }
item_subtext = "{collection.countlabel}"
item_caption = "{collection.name}"
item_fit = "cover"
item_background = "#1f2530"
corner_radius = 0.01
selected_scale = 1.06
selected_border = "#ffffff"
unselected_opacity = 0.8

[[collections.elements]]
type = "helpbar"
name = "pn_help"
z = 7
pos = [0.955, 0.96]
origin = [1.0, 0.5]
size = [0.8, 0.042]
style = { font = "medium", font_size = 0.02, color = "#c9cfda", align = "right" }

# ------------------------------------------------------------------ games

[games]
background = "#0c0f14"

[[games.elements]]
type = "rect"
name = "pn_background"
z = -3
size = [1.0, 1.0]
color = "#0c0f14"

[[games.elements]]
type = "image"
name = "pn_picture"
z = -1
