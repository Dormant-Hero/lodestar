id = "fixture-library"
name = "Fixture Library"
author = "Lodestar tests"
version = "0.1"
kind = "library"
exec = "bin/run.sh"
timeout_secs = 5
permissions = ["reads its own folder"]

[[settings]]
key = "token"
label = "Token"
kind = "secret"
default = "default-token"

[[settings]]
key = "region"
label = "Region"
kind = "text"
default = "eu"
